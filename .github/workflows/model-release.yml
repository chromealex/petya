name: Model release
# Every part folder with weights on this `models` branch (andromeda/D1/, andromeda/R2/, …) becomes a GitHub release
# tagged <group>-<part> (andromeda-d1) with its files and the group's group.json. Hashes in model.json are checked
# before publishing; only `status: stable…` makes a full release. Weights never go to main or the project folder.
on:
  push:
    branches: [models]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first drafts model was published as petya-v1.0 before groups: it becomes andromeda-d1.
          if gh release view petya-v1.0 >/dev/null 2>&1 && ! gh release view andromeda-d1 >/dev/null 2>&1; then gh release edit petya-v1.0 --tag andromeda-d1; fi
          for model in */[RAD][0-9]*/model.json; do
            dir="${model%/model.json}"; group="${dir%%/*}"; part="${dir##*/}"
            info=$(python3 - "$dir" <<'PY'
          import hashlib,json,sys,pathlib
          d=pathlib.Path(sys.argv[1]);m=json.loads((d/'model.json').read_text())
          assert m['id']==d.name and m['group'].lower()==d.parent.name,'model.json id and group must match the folders'
          files=(m.get('adapter') or {}).get('files') or {}
          for name,expected in files.items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==expected,name
          print(('weights' if files else 'none')+'|'+('' if m['status'].startswith('stable') else '--prerelease')+'|Petya '+m['group']+' '+m['id'])
          PY
            )
            IFS='|' read -r weights pre title <<<"$info"
            [ "$weights" = weights ] || continue
            tag="$group-$(echo "$part" | tr 'A-Z' 'a-z')"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes-file "$dir/NOTES.md" $([ -z "$pre" ] && echo --prerelease=false || echo --prerelease)
              gh release upload "$tag" "$dir"/* "$group/group.json" --clobber
            else
              gh release create "$tag" "$dir"/* "$group/group.json" --target "$GITHUB_SHA" --title "$title" --notes-file "$dir/NOTES.md" $pre
            fi
          done
