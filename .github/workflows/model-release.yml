name: Model release
# Every version folder on this `models` branch (petya-v1.0/, petya-v1.1/, …) becomes a GitHub release with the
# same tag once it is pushed; the weights live on this branch and in the releases, never on main or in the
# project folder. Hashes in model.json are checked before publishing.
on:
  push:
    branches: [models]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in petya-v*/; do
            tag="${dir%/}"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            python3 - "$tag" <<'PY'
          import hashlib,json,sys,pathlib
          d=pathlib.Path(sys.argv[1]);m=json.loads((d/'model.json').read_text())
          assert m['release']==d.name,'model.json release must equal the folder name'
          for name,expected in m['adapter']['files'].items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==expected,name
          PY
            pre=$(python3 -c "import json;print('--prerelease' if json.load(open('$tag/model.json'))['status'].startswith('experimental') else '')")
            gh release create "$tag" "$tag"/* --target "$GITHUB_SHA" --title "Petya model ${tag#petya-v}" --notes-file "$tag/NOTES.md" $pre
          done
