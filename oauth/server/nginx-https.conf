# Enable only after the certificate exists. Replaces the HTTP-only staging file.
limit_req_zone $binary_remote_addr zone=petya_sessions:10m rate=10r/m;
server {
    listen 80;
    server_name auth.petya-app.ru;
    access_log off;
    error_log /var/log/nginx/petya-auth-error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://auth.petya-app.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name auth.petya-app.ru;
    ssl_certificate /etc/letsencrypt/live/auth.petya-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.petya-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/petya-auth-error.log crit;
    client_max_body_size 16k;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(slack/|notion/|asana/)?v1/sessions$ {
        limit_req zone=petya_sessions burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host auth.petya-app.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host auth.petya-app.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;
    }
}
