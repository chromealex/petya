limit_req_zone $binary_remote_addr zone=petya_auth:10m rate=10r/m;
server {
    listen 80;
    server_name auth.petya-app.ru;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/petya-auth-error.log crit;
    client_max_body_size 16k;
    location / {
        add_header Content-Type 'text/plain; charset=utf-8';
        return 503 'Petya authorization is being configured.\n';
    }
    location /.well-known/acme-challenge/ { root /var/www/html; }
}
