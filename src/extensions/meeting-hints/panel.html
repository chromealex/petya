<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"><title>Подсказки на встрече</title><script src="../../ui/i18n-core.js"></script><script src="../../ui/i18n.js"></script><link rel="stylesheet" href="panel.css"></head><body>
