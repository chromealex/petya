<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>petya-region</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;cursor:crosshair;user-select:none;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 body{background:transparent}
 #shot{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
 #dim{position:fixed;inset:0;background:#0000005c}
 #box{position:fixed;display:none;outline:1.5px solid #c9ed9d;box-shadow:0 0 0 9999px #00000070;background:transparent}
 #size{position:fixed;display:none;padding:2px 6px;border-radius:5px;background:#000c;color:#fff;font-variant-numeric:tabular-nums}
 #hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:#000c;color:#fff;pointer-events:none}
</style>
</head>
<body>
<img id="shot" alt="">
<div id="dim"></div><div id="box"></div><div id="size"></div>
<div id="hint">Выделите область · Enter — весь экран · Esc — отмена</div>
<script>
// Region picker for «Скриншот → задача». The screen picture is already taken; it is shown under a dim layer and
// the user drags a rectangle. The answer goes back through the document title (no preload, no Node here):
// «petya-region:{"x":…,"y":…,"w":…,"h":…}» in CSS pixels of this window, «petya-region:full» or «petya-region:cancel».
(()=>{
 const q=new URLSearchParams(location.hash.slice(1));
 const hint=q.get('hint');if(hint)document.getElementById('hint').textContent=hint;
 const box=document.getElementById('box'),size=document.getElementById('size'),dim=document.getElementById('dim');
 let start=null,done=false;
 const send=v=>{if(done)return;done=true;document.title='petya-region:'+v;};
 window.petyaShot=url=>{document.getElementById('shot').src=url;};
 const rect=e=>{const x=Math.min(start.x,e.clientX),y=Math.min(start.y,e.clientY);return {x,y,w:Math.abs(e.clientX-start.x),h:Math.abs(e.clientY-start.y)};};
 addEventListener('mousedown',e=>{if(e.button!==0)return;start={x:e.clientX,y:e.clientY};});
 addEventListener('mousemove',e=>{if(!start)return;const r=rect(e);dim.style.display='none';box.style.display=size.style.display='block';
  Object.assign(box.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
  size.textContent=Math.round(r.w*devicePixelRatio)+' × '+Math.round(r.h*devicePixelRatio);Object.assign(size.style,{left:r.x+'px',top:Math.max(0,r.y-24)+'px'});});
 addEventListener('mouseup',e=>{if(!start)return;const r=rect(e);start=null;if(r.w<6||r.h<6){box.style.display=size.style.display='none';dim.style.display='block';return;}send(JSON.stringify(r));});
 addEventListener('keydown',e=>{if(e.key==='Escape')send('cancel');else if(e.key==='Enter')send('full');});
 addEventListener('blur',()=>setTimeout(()=>{if(!document.hasFocus())send('cancel');},400));
})();
</script>
</body>
</html>
